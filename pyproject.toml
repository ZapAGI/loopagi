[project]
name = "god-in-the-loop-code"
version = "1.0.0"
description = "Companion code for God in the Loop by Alexandros Karales"
authors = [
    { name = "Alexandros Karales", email = "karales@gmail.com" }
]
requires-python = ">=3.12"
license = { text = "All Rights Reserved" }
readme = "README.md"

dependencies = [
    "langchain",
    "langchain-ollama",
    "langchain-community",
    "langgraph",
    "qdrant-client",
    "fastembed",
    "numpy",
    "matplotlib",
    "networkx",
    "rich",
    "gitpython",
    "httpx",
    "polars>=1.39.2",
]

[project.optional-dependencies]
notebooks = [
    "jupyter",
    "ipywidgets",
]
voice = [
    "faster-whisper",
    "piper-tts",
    "sounddevice",
    "soundfile",
    "numpy",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
loopagi = "loopagi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loopagi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
